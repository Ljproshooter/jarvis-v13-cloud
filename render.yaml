services:
  - type: web
    name: lj-ai-mobile-staging
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_USER_MODEL
        value: gpt-5-mini
      - key: OPENAI_ADMIN_MODEL
        value: gpt-5.6
      - key: OPENAI_VOICE_REPLY_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VOICE_DEEP_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: cedar
      - key: OPENAI_WEB_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-5.6
      - key: OPENAI_TEXT_FAST_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TEXT_SERVICE_TIER
        value: fast
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_VOICE_SERVICE_TIER
        value: fast
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: cedar
      - key: REQUEST_TIMEOUT_SECONDS
        value: "75"
      - key: MAX_AUDIO_BYTES
        value: "15728640"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYPAL_CHECKOUT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BASIC_3_MONTHS
        sync: false
      - key: STRIPE_PRICE_BASIC_YEARLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_3_MONTHS
        sync: false
      - key: STRIPE_PRICE_PREMIUM_YEARLY
        sync: false
      - key: STRIPE_PRICE_VIP_MONTHLY
        sync: false
      - key: STRIPE_PRICE_VIP_3_MONTHS
        sync: false
      - key: STRIPE_PRICE_VIP_YEARLY
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: "https://lj-ai-mobile-staging.onrender.com/v1/billing/success?session_id={CHECKOUT_SESSION_ID}"
      - key: STRIPE_CANCEL_URL
        value: https://lj-ai-mobile-staging.onrender.com/v1/billing/cancel
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://lj-ai-mobile-staging.onrender.com/v1/billing/success
      - key: SMARTTHINGS_CLIENT_ID
        sync: false
      - key: SMARTTHINGS_CLIENT_SECRET
        sync: false
      - key: SMARTTHINGS_REDIRECT_URI
        value: https://lj-ai-mobile-staging.onrender.com/v1/smartthings/oauth/callback
      - key: SMARTTHINGS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SMARTTHINGS_SCOPES
        value: "r:devices:* x:devices:* r:locations:* r:scenes:* x:scenes:*"
      - key: LJ_PAIRING_HMAC_SECRET
        sync: false
      - key: SUPPORT_DISCORD
        value: ljproshooter7229
      - key: SUPPORT_INSTAGRAM
        sync: false
      - key: SUPPORT_TELEGRAM
        sync: false
      - key: CLIENT_LATEST_VERSION
        sync: false
      - key: CLIENT_UPDATE_URL
        sync: false
      - key: CLIENT_UPDATE_SHA256
        sync: false
      - key: CLIENT_UPDATE_NOTES
        sync: false
