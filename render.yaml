services:
  - type: web
    name: jarvis-v13-cloud
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_USER_MODEL
        value: gpt-5-mini
      - key: OPENAI_ADMIN_MODEL
        value: gpt-5.6
      - key: OPENAI_VOICE_REPLY_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VOICE_DEEP_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: cedar
      - key: OPENAI_WEB_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TEXT_FAST_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TEXT_SERVICE_TIER
        value: fast
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_VOICE_SERVICE_TIER
        value: fast
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: cedar
      - key: PAYPAL_CHECKOUT_URL
        sync: false
      - key: SUPPORT_DISCORD
        value: ljproshooter7229
      - key: SUPPORT_INSTAGRAM
        sync: false
      - key: SUPPORT_TELEGRAM
        sync: false
      - key: CLIENT_LATEST_VERSION
        value: 15.4.0
      - key: CLIENT_UPDATE_URL
        sync: false
      - key: CLIENT_UPDATE_SHA256
        sync: false
      - key: CLIENT_UPDATE_NOTES
        value: V15.4.0 restores reliable audio and Realtime voice, upgrades the Voice UI, repairs Community messaging and adds Clear All News.
